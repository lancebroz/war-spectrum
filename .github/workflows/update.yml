name: Update data

on:
  schedule:
    # 9:15 AM Central during daylight time (14:15 UTC). GitHub cron is UTC
    # and ignores DST — becomes 8:15 AM CT after the November clock change.
    - cron: '15 14 * * *'
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: war-spectrum-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Build WAR spectrum feed
      run: python src/build_feed.py

    - name: Configure git
      run: |
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"

    - name: Commit and push changes
      run: |
        git add -A
        git diff --staged --quiet || git commit -m "Update feed $(date -u +'%Y-%m-%d %H:%M UTC')"
        git pull --rebase --autostash origin main
        git push || (git pull --rebase --autostash origin main && git push)
