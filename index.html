<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Blame Spectrum — Live Pitcher WAR</title>
<meta name="description" content="Drag the slider from FIP-based to RA9-based WAR and watch this season's pitcher leaderboard reshuffle. Live MLB stats, updated every morning." />
<meta property="og:title" content="The Blame Spectrum — Live Pitcher WAR" />
<meta property="og:description" content="Drag the slider from FIP-based to RA9-based WAR and watch this season's pitcher leaderboard reshuffle." />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --bg: #EEF2ED;
  --card: #FFFFFF;
  --ink: #17251D;
  --ink-soft: #55665D;
  --line: #D5DED6;
  --fip: #2451D8;
  --ra9: #C42430;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Barlow', system-ui, sans-serif;
  padding: 32px 20px 48px;
}
.shell { max-width: 720px; margin: 0 auto; }

h1 {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700; text-transform: uppercase;
  font-size: clamp(38px, 7vw, 60px);
  line-height: 0.95; letter-spacing: 0.01em; margin: 0;
}
.fresh {
  font-family: 'IBM Plex Mono', monospace; font-size: 12px;
  color: var(--ink-soft); margin: 10px 0 0;
}

/* ---- slider ---- */
.band { margin-top: 28px; }
.poles { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.pole-name {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
  text-transform: uppercase; font-size: 22px; line-height: 1;
}
.pole-desc { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
.pole.right { text-align: right; }
.pole.left .pole-name { color: var(--fip); }
.pole.right .pole-name { color: var(--ra9); }

#lam {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 10px; border-radius: 6px;
  background: linear-gradient(90deg, var(--fip), var(--ra9));
  outline: none; cursor: pointer; display: block; margin: 0;
}
#lam::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--card); border: 7px solid var(--thumb, var(--fip));
  box-shadow: 0 1px 4px rgba(20,30,25,0.35);
}
#lam::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--card); border: 6px solid var(--thumb, var(--fip));
  box-shadow: 0 1px 4px rgba(20,30,25,0.35);
}
#lam:focus-visible { box-shadow: 0 0 0 3px rgba(36,81,216,0.35); }

.under {
  display: flex; justify-content: space-between; align-items: center; margin-top: 12px;
}
.readout-num { font-family: 'IBM Plex Mono', monospace; font-size: 26px; font-weight: 600; }
.presets { display: flex; gap: 8px; }
.btn {
  font-family: 'Barlow', sans-serif; font-weight: 600; font-size: 13px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink);
  border-radius: 7px; padding: 6px 12px; cursor: pointer;
}
.btn:hover { border-color: var(--ink-soft); }
.btn:focus-visible { outline: 2px solid var(--fip); outline-offset: 1px; }
.btn[aria-pressed="true"] { border-color: var(--ink); background: var(--card); box-shadow: inset 0 0 0 1px var(--ink); }

/* ---- controls ---- */
.controls { display: flex; gap: 8px; flex-wrap: wrap; margin: 26px 0 14px; }
.controls input[type="text"] { flex: 1; min-width: 140px; }
input[type="text"], input[type="number"], select {
  font-family: 'IBM Plex Mono', monospace; font-size: 13px;
  padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px;
  background: var(--card); color: var(--ink);
}
input:focus-visible, select:focus-visible { outline: 2px solid var(--fip); outline-offset: 1px; }
input[type="number"] { width: 76px; }
label.ctl {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: 'IBM Plex Mono', monospace; font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft);
}

/* ---- leaderboard ---- */
#board { position: relative; }
.row {
  position: absolute; left: 0; right: 0; height: 44px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--line);
  transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.2, 1);
}
@media (prefers-reduced-motion: reduce) { .row { transition: none; } }
.rank {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
  font-size: 19px; width: 26px; color: var(--ink-soft); text-align: center; flex: none;
}
.row-name {
  flex: 1; min-width: 0; font-weight: 600; font-size: 14px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.row-meta { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--ink-soft); font-weight: 400; }
.chip {
  font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 500;
  border-radius: 4px; padding: 2px 6px; flex: none;
}
.chip.fip { background: rgba(36,81,216,0.12); color: var(--fip); }
.chip.ra9 { background: rgba(196,36,48,0.12); color: var(--ra9); }
.row-war {
  font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 600;
  flex: none; width: 52px; text-align: right;
}
#note { font-size: 13px; color: var(--ink-soft); margin: 12px 0 0; }

.foot {
  font-family: 'IBM Plex Mono', monospace; font-size: 11px;
  color: var(--ink-soft); margin-top: 28px;
}
.foot a { color: inherit; }
#error { display: none; font-size: 14px; color: var(--ink-soft); margin-top: 24px; }
</style>
</head>
<body>
<div class="shell">
  <h1>The Blame Spectrum</h1>
  <p class="fresh" id="fresh">Loading&hellip;</p>

  <p id="error">
    Couldn't load <code>data/war_spectrum.json</code>. Run the "Update data"
    action once, or serve this page from the repo root.
  </p>

  <div id="app" hidden>
    <div class="band">
      <div class="poles">
        <div class="pole left">
          <div class="pole-name">FIP-based</div>
          <div class="pole-desc">K &middot; BB &middot; HR only</div>
        </div>
        <div class="pole right">
          <div class="pole-name">RA9-based</div>
          <div class="pole-desc">every run counts</div>
        </div>
      </div>
      <input id="lam" type="range" min="0" max="100" value="35"
             aria-label="Blame attribution: percent results-based" />
      <div class="under">
        <span class="readout-num" id="readout-num">65 / 35</span>
        <div class="presets">
          <button class="btn preset" data-v="0">fWAR</button>
          <button class="btn preset" data-v="50">50/50</button>
          <button class="btn preset" data-v="100">bWAR</button>
        </div>
      </div>
    </div>

    <div class="controls">
      <input type="text" id="search" placeholder="Search&hellip;" aria-label="Search pitcher" />
      <label class="ctl">Min IP <input type="number" id="min-ip" value="100" min="20" step="10" /></label>
      <label class="ctl">
        <select id="role" aria-label="Role">
          <option value="all">All</option>
          <option value="sp">SP</option>
          <option value="rp">RP</option>
        </select>
      </label>
    </div>

    <div id="board"></div>
    <p id="note"></p>

    <p class="foot">Simplified two-pole WAR &middot; updates every morning &middot;
      <a href="https://github.com/lancebroz/war-spectrum">method &amp; code</a></p>
  </div>
</div>

<script>
(function () {
  "use strict";

  var FIP_COLOR = "#2451D8", RA9_COLOR = "#C42430";
  var ROW_H = 44, BOARD_MAX = 25;

  var state = { lam: 0.35, data: null, search: "", minIp: 100, role: "all" };

  var $ = function (id) { return document.getElementById(id); };

  function warAt(p, lam) { return (1 - lam) * p.war_fip + lam * p.war_ra9; }
  function roleOf(p) { return p.g > 0 && p.gs / p.g >= 0.5 ? "sp" : "rp"; }
  function lerpColor(a, b, t) {
    function hx(c, i) { return parseInt(c.slice(i, i + 2), 16); }
    var out = "#";
    for (var i = 1; i < 7; i += 2) {
      var v = Math.round(hx(a, i) + (hx(b, i) - hx(a, i)) * t);
      out += (v < 16 ? "0" : "") + v.toString(16);
    }
    return out;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function eligible() {
    return state.data.pitchers.filter(function (p) {
      if (p.ip < state.minIp) return false;
      if (state.role !== "all" && roleOf(p) !== state.role) return false;
      return true;
    });
  }

  function renderBoard() {
    var pool = eligible().map(function (p) { return { p: p, war: warAt(p, state.lam) }; });
    pool.sort(function (a, b) { return b.war - a.war; });
    pool.forEach(function (e, i) { e.rank = i + 1; });

    var q = state.search.trim().toLowerCase();
    var rows = pool.filter(function (e) {
      return !q || e.p.name.toLowerCase().indexOf(q) >= 0 || (e.p.team || "").toLowerCase().indexOf(q) >= 0;
    }).slice(0, BOARD_MAX);

    var board = $("board");
    board.style.height = rows.length * ROW_H + "px";

    var want = rows.map(function (e) { return e.p.id; }).join(",");
    if (board.dataset.ids !== want) {
      board.dataset.ids = want;
      board.innerHTML = rows.map(function (e) {
        var p = e.p;
        return '<div class="row" data-id="' + p.id + '">' +
          '<div class="rank"></div>' +
          '<div class="row-name">' + esc(p.name) +
            ' <span class="row-meta">' + esc(p.team) + ' &middot; ' + p.ip_display + '</span></div>' +
          '<span class="chip"></span>' +
          '<span class="row-war"></span>' +
        '</div>';
      }).join("");
    }

    rows.forEach(function (e, idx) {
      var el = board.querySelector('.row[data-id="' + e.p.id + '"]');
      if (!el) return;
      el.style.transform = "translateY(" + idx * ROW_H + "px)";
      el.querySelector(".rank").textContent = e.rank;
      el.querySelector(".row-war").textContent = e.war.toFixed(2);
      var diff = e.p.war_fip - e.p.war_ra9;
      var chip = el.querySelector(".chip");
      if (diff >= 0) {
        chip.className = "chip fip";
        chip.textContent = "FIP +" + diff.toFixed(1);
        chip.title = "The FIP model likes this pitcher more by " + diff.toFixed(2) + " WAR";
      } else {
        chip.className = "chip ra9";
        chip.textContent = "RA9 +" + (-diff).toFixed(1);
        chip.title = "The RA9 model likes this pitcher more by " + (-diff).toFixed(2) + " WAR";
      }
    });

    $("note").textContent = q && !rows.length ? "No matches." : "";
  }

  function renderReadout() {
    var pct = Math.round(state.lam * 100);
    var num = $("readout-num");
    num.textContent = (100 - pct) + " / " + pct;
    var blend = lerpColor(FIP_COLOR, RA9_COLOR, state.lam);
    num.style.color = blend;
    $("lam").style.setProperty("--thumb", blend);
    document.querySelectorAll(".preset").forEach(function (b) {
      b.setAttribute("aria-pressed", String(parseInt(b.dataset.v, 10) === pct));
    });
  }

  function renderAll() { renderReadout(); renderBoard(); }

  $("lam").addEventListener("input", function () {
    state.lam = this.value / 100;
    renderAll();
  });
  document.querySelectorAll(".preset").forEach(function (b) {
    b.addEventListener("click", function () {
      $("lam").value = this.dataset.v;
      state.lam = this.dataset.v / 100;
      renderAll();
    });
  });
  $("search").addEventListener("input", function () { state.search = this.value; renderBoard(); });
  $("min-ip").addEventListener("input", function () {
    var v = parseFloat(this.value);
    state.minIp = isFinite(v) ? Math.max(0, v) : 0;
    renderBoard();
  });
  $("role").addEventListener("change", function () { state.role = this.value; renderBoard(); });

  fetch("data/war_spectrum.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (data) {
      state.data = data;
      var meta = data.meta || {};
      var fresh = "MLB " + (meta.season || "");
      if (meta.data_through) fresh += " \u00b7 through " + meta.data_through;
      fresh += " \u00b7 updates every morning";
      $("fresh").textContent = fresh;
      $("app").hidden = false;
      renderAll();
    })
    .catch(function (err) {
      $("fresh").textContent = "";
      $("error").style.display = "block";
      console.error(err);
    });
})();
</script>
</body>
</html>
